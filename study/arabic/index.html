<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아랍어 단어 마스터 문제은행 (단어 357 &amp; 테마별 2300)</title>
  <!-- Google Fonts: Noto Sans Arabic & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #dbeafe;
      --primary-hover: #1d4ed8;
      --secondary: #0f766e;
      --secondary-light: #ccfbf1;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --success: #16a34a;
      --success-light: #dcfce7;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
      color: #fff;
      padding: 22px 24px;
      border-radius: var(--radius);
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    header p {
      font-size: 0.88rem;
      opacity: 0.9;
    }

    /* Book Tabs */
    .book-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .book-btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .book-btn:hover {
      border-color: var(--primary);
    }

    .book-btn.active {
      border-color: var(--primary);
      background-color: #eff6ff;
      box-shadow: 0 2px 8px rgba(30, 64, 175, 0.15);
    }

    .book-btn .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 4px;
    }

    .book-btn[data-book="book357"] .badge {
      background: var(--secondary-light);
      color: var(--secondary);
    }

    .book-btn[data-book="book2300"] .badge {
      background: var(--primary-light);
      color: var(--primary);
    }

    .book-btn .title {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .book-btn .sub {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Control Panel */
    .panel {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
      border: 1px solid #e2e8f0;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    @media (max-width: 600px) {
      .controls-grid, .book-tabs {
        grid-template-columns: 1fr;
      }
    }

    .control-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.92rem;
      font-family: inherit;
      background-color: #fff;
      color: var(--text);
    }

    /* Toggles Row */
    .toggles-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip-btn.on {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .chip-btn.wrong-note-btn {
      border-color: #fca5a5;
      background: #fef2f2;
      color: var(--danger);
    }

    .chip-btn.wrong-note-btn.on {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    /* Quiz Card */
    .quiz-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 26px 24px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.07);
      border: 1px solid #e2e8f0;
      position: relative;
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px dashed #e2e8f0;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-box {
      text-align: center;
      padding: 20px 12px;
      background: #f8fafc;
      border-radius: 12px;
      margin-bottom: 22px;
      border: 1px solid #e2e8f0;
    }

    .unit-tag {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--secondary);
      background: var(--secondary-light);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .arabic-word {
      font-family: 'Noto Sans Arabic', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      color: #0f172a;
      direction: rtl;
      unicode-bidi: isolate;
      line-height: 1.5;
      margin: 6px 0;
    }

    .korean-question {
      font-size: 1.7rem;
      font-weight: 700;
      color: #0f172a;
      margin: 12px 0;
    }

    .pronunciation-box {
      font-size: 1.05rem;
      color: var(--primary);
      font-weight: 600;
      margin-top: 6px;
      min-height: 26px;
    }

    .pronunciation-box.hidden {
      visibility: hidden;
    }

    .audio-btn {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s;
    }

    .audio-btn:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Multiple Choice */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 560px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-btn {
      padding: 15px 16px;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      background: #fff;
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 62px;
    }

    .option-btn .ar-opt {
      font-family: 'Noto Sans Arabic', sans-serif;
      font-size: 1.65rem;
      direction: rtl;
      line-height: 1.4;
    }

    .option-btn .sub-pron {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: var(--success-light);
      color: #14532d;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-light);
      color: #7f1d1d;
    }

    /* Subjective Input */
    .subjective-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sub-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.15rem;
      border-radius: 12px;
      border: 2px solid var(--border);
      text-align: center;
      font-family: inherit;
    }

    .sub-input.ar-input {
      font-family: 'Noto Sans Arabic', sans-serif;
      font-size: 1.8rem;
      direction: rtl;
    }

    .sub-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .primary-action-btn {
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .primary-action-btn:hover {
      background: var(--primary-hover);
    }

    /* Feedback Banner */
    .feedback-box {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.ok {
      background: var(--success-light);
      border: 1px solid #86efac;
      color: #14532d;
    }

    .feedback-box.no {
      background: var(--danger-light);
      border: 1px solid #fca5a5;
      color: #7f1d1d;
    }

    .next-row {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .secondary-btn {
      padding: 11px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .secondary-btn:hover {
      background: #f1f5f9;
    }

    /* Wrong Note Drawer / View */
    .wrong-list-box {
      display: none;
    }

    .wrong-list-box.active {
      display: block;
    }

    .wrong-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #e2e8f0;
      gap: 12px;
    }

    .wrong-item:last-child {
      border-bottom: none;
    }

    .wrong-item .ar {
      font-family: 'Noto Sans Arabic', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      direction: rtl;
    }

    .wrong-item .info {
      flex: 1;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
    }

    .tip-note {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>
      <span>🕌 아랍어 단어 마스터 문제은행</span>
      <span id="scoreBadge" style="font-size:0.85rem; background:rgba(255,255,255,0.2); padding:4px 12px; border-radius:999px;">정답률 0% (0/0)</span>
    </h1>
    <p>교재별·단원별 맞춤형 암기 테스트 (객관식 · 주관식 · 오답노트 · 발음 토글 지원)</p>
  </header>

  <!-- 1. 교재 선택 -->
  <div class="book-tabs">
    <button class="book-btn active" data-book="book357" onclick="selectBook('book357')">
      <span class="badge">입문 필수</span>
      <span class="title">뻔뻔하고 펀하게 남 배우는 아랍어 단어 357</span>
      <span class="sub">기초 인사·가족·숫자·필수 사물·기초 동사 중심</span>
    </button>
    <button class="book-btn" data-book="book2300" onclick="selectBook('book2300')">
      <span class="badge">실전 확장</span>
      <span class="title">테마별 아랍어 단어 2300</span>
      <span class="sub">15개 생활·실용 테마별 현대 표준 아랍어 어휘</span>
    </button>
  </div>

<!-- 2. 단원 및 문제 유형 설정 -->
  <div class="panel">
    <div class="controls-grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));">
      <div class="control-group">
        <label for="unitSelect">📚 단원(테마) 선택</label>
        <select id="unitSelect" onchange="resetQuiz()"></select>
      </div>
      <div class="control-group">
        <label for="modeSelect">📝 문제 출제 방식</label>
        <select id="modeSelect" onchange="resetQuiz()">
          <option value="mc_ar2ko">객관식 (아랍어 → 한글 뜻)</option>
          <option value="mc_ko2ar">객관식 (한글 뜻 → 아랍어)</option>
          <option value="sub_ar2ko">주관식 (아랍어 보고 한글 뜻 입력)</option>
          <option value="sub_ko2ar">주관식 (한글 뜻 보고 아랍어 입력)</option>
        </select>
      </div>
      <div class="control-group">
        <label for="limitSelect">🎯 출제 문제 수</label>
        <select id="limitSelect" onchange="resetQuiz()">
          <option value="10">10문제 (가볍게)</option>
          <option value="20" selected>20문제 (기본 추천)</option>
          <option value="30">30문제 (집중 학습)</option>
          <option value="ALL">전체 문제 다 풀기</option>
        </select>
      </div>
    </div>

    <div class="toggles-row">
      <div class="toggle-group">
        <button id="togglePronBtn" class="chip-btn on" onclick="togglePronunciation()">
          🔤 발음(음역) 표시: ON
        </button>
        <button id="toggleHarakatBtn" class="chip-btn on" onclick="toggleHarakat()">
          ✨ 모음부호(하르카트): ON
        </button>
      </div>
      <div class="toggle-group">
        <button id="wrongModeBtn" class="chip-btn wrong-note-btn" onclick="toggleWrongMode()">
          📌 오답 노트 (<span id="wrongCount">0</span>)
        </button>
      </div>
    </div>
  </div>

  <!-- 3. 퀴즈 메인 영역 -->
  <div id="quizArea" class="quiz-card">
    <div class="quiz-meta">
      <span id="questionCounter">문제 1 / 10</span>
      <span id="bookIndicator">아랍어 단어 357</span>
    </div>

    <div class="progress-bar-wrap">
      <div id="progressFill" class="progress-bar-fill"></div>
    </div>

    <div class="question-box">
      <div id="unitTag" class="unit-tag">1단원. 기초 인사와 표현</div>
      <div id="questionMain" class="arabic-word">مَرْحَبًا</div>
      <div id="pronunciationText" class="pronunciation-box">[마르하반 / marḥaban]</div>
      <button class="audio-btn" onclick="speakCurrentWord()" title="브라우저 음성 엔진으로 아랍어 발음 듣기">
        🔊 발음 듣기
      </button>
    </div>

    <!-- 객관식 보기 -->
    <div id="mcArea" class="options-grid"></div>

    <!-- 주관식 입력 -->
    <div id="subArea" class="subjective-wrap" style="display:none;">
      <input type="text" id="subInput" class="sub-input" placeholder="정답을 입력하세요" onkeydown="if(event.key==='Enter') checkSubjective()" />
      <button class="primary-action-btn" onclick="checkSubjective()">정답 확인</button>
    </div>

    <!-- 정오답 피드백 -->
    <div id="feedbackBox" class="feedback-box"></div>

    <div class="next-row">
      <button class="secondary-btn" onclick="shuffleAndRestart()">🔀 현재 단원 다시 섞기</button>
      <button id="nextBtn" class="primary-action-btn" onclick="nextQuestion()">다음 문제 ➔</button>
    </div>
  </div>

  <!-- 4. 오답 노트 전용 패널 -->
  <div id="wrongNoteArea" class="quiz-card wrong-list-box">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px;">
      <h2 style="font-size:1.15rem;">📌 나만의 오답 노트</h2>
      <div style="display:flex; gap:8px;">
        <button class="primary-action-btn" style="padding:8px 14px; font-size:0.88rem;" onclick="startWrongQuiz()">오답만 집중 퀴즈 풀기</button>
        <button class="secondary-btn" style="padding:8px 12px; font-size:0.85rem;" onclick="clearWrongNotes()">전체 비우기</button>
      </div>
    </div>
    <div id="wrongListContainer"></div>
  </div>

  <p class="tip-note">💡 팁: 오답은 브라우저에 자동 저장되며, 모음부호(하르카트)를 끄면 실제 아랍어 신문·간판처럼 자음 위주로 읽는 실전 훈련이 가능합니다.</p>
</div>

<script>
  // =========================================================================
  // 교재별·단원별 아랍어 핵심 어휘 데이터베이스
  // (추후 단어를 추가하실 때는 아래 배열 형식 그대로 한 줄씩 추가하시면 됩니다)
  // =========================================================================
  const VOCAB_DB = {
    book357: {
      title: "뻔뻔하고 펀하게 남 배우는 아랍어 단어 357",
      units: {
        "1단원: 기초 인사와 필수 회화 (30단어)": [
          { ar: "مَرْحَبًا", pron: "마르하반 (marḥaban)", ko: "안녕하세요", alts: ["안녕", "반갑습니다"] },
          { ar: "السَّلَامُ عَلَيْكُمْ", pron: "앗살라무 알라이쿰 (as-salāmu ʿalaykum)", ko: "평화가 있기를 (기본 인사)", alts: ["안녕하세요", "인사"] },
          { ar: "وَعَلَيْكُمُ السَّلَامُ", pron: "와 알라이쿠무스 살람 (wa-ʿalaykumu s-salām)", ko: "당신에게도 평화가 (인사 대답)", alts: ["안녕하세요", "대답"] },
          { ar: "أَهْلًا وَسَهْلًا", pron: "아흘란 와 사흘란 (ahlan wa-sahlan)", ko: "환영합니다", alts: ["어서오세요", "반갑습니다"] },
          { ar: "أَهْلًا بِكَ", pron: "아흘란 비카 (ahlan bika)", ko: "반갑습니다 (환영 대답)", alts: ["반가워요", "고맙습니다"] },
          { ar: "صَبَاحُ الْخَيْرِ", pron: "사바훌 카이르 (ṣabāḥu l-khayr)", ko: "좋은 아침입니다", alts: ["아침 인사"] },
          { ar: "صَبَاحُ النُّورِ", pron: "사바훈 누르 (ṣabāḥu n-nūr)", ko: "좋은 아침입니다 (대답)", alts: ["아침 인사 대답"] },

  // =========================================================================
  // 상태 관리
  // =========================================================================
  let currentBook = "book357";
  let currentUnit = "ALL";
  let showPron = true;
  let showHarakat = true;
  let isWrongNoteView = false;
  let isWrongQuizMode = false;

  let quizPool = [];
  let currentIndex = 0;
  let answered = false;
  let stats = { correct: 0, total: 0 };

  // 오답 노트 로컬스토리지 로드
  let wrongNotes = JSON.parse(localStorage.getItem("arabic_wrong_notes_v1") || "[]");

  // 아랍어 모음 기호(하르카트) 제거 유틸리티
  function stripHarakat(text) {
    return text.replace(/[\u064B-\u065F\u0670]/g, "");
  }

  function formatArabic(text) {
    return showHarakat ? text : stripHarakat(text);
  }

  // 초기화
  function init() {
    updateWrongCount();
    populateUnits();
    resetQuiz();
  }

  function selectBook(bookKey) {
    currentBook = bookKey;
    isWrongQuizMode = false;
    if (isWrongNoteView) toggleWrongMode(false);

    document.querySelectorAll(".book-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.book === bookKey);
    });

    populateUnits();
    resetQuiz();
  }

  function populateUnits() {
    const select = document.getElementById("unitSelect");
    select.innerHTML = "";

    const allOpt = document.createElement("option");
    allOpt.value = "ALL";
    allOpt.textContent = "📖 전체 단원 통합 랜덤 출제";
    select.appendChild(allOpt);

    const units = VOCAB_DB[currentBook].units;
	  Object.keys(units).forEach(unitName => {
      const opt = document.createElement("option");
      opt.value = unitName;
      // 기존에 이미 (OO단어)가 붙어있으면 중복 표시 제거
      const cleanName = unitName.replace(/\s*\(\d+단어\)$/, "");
      opt.textContent = `${cleanName} (${units[unitName].length}단어)`;
      select.appendChild(opt);
    });
  }

  function getSelectedWords() {
    if (isWrongQuizMode) {
      return [...wrongNotes];
    }
    const unitVal = document.getElementById("unitSelect").value;
    const units = VOCAB_DB[currentBook].units;
    let list = [];

    if (unitVal === "ALL") {
      Object.entries(units).forEach(([uName, words]) => {
        words.forEach(w => list.push({ ...w, unit: uName, book: VOCAB_DB[currentBook].title }));
      });
    } else {
      (units[unitVal] || []).forEach(w => {
        list.push({ ...w, unit: unitVal, book: VOCAB_DB[currentBook].title });
      });
    }
    return list;
  }

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

function resetQuiz() {
    if (!isWrongQuizMode && isWrongNoteView) {
      toggleWrongMode(false);
    }
    const words = getSelectedWords();
    const limitVal = document.getElementById("limitSelect").value;
    let shuffled = shuffleArray(words);

    if (limitVal !== "ALL") {
      shuffled = shuffled.slice(0, parseInt(limitVal, 10));
    }

    quizPool = shuffled;
    currentIndex = 0;
    renderQuestion();
  }

  function shuffleAndRestart() {
    quizPool = shuffleArray(quizPool);
    currentIndex = 0;
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const feedbackBox = document.getElementById("feedbackBox");
    feedbackBox.className = "feedback-box";
    feedbackBox.innerHTML = "";

    if (quizPool.length === 0) {
      document.getElementById("questionMain").textContent = "단어 없음";
      document.getElementById("pronunciationText").textContent = "";
      document.getElementById("mcArea").innerHTML = "";
      return;
    }

    const q = quizPool[currentIndex];
    const mode = document.getElementById("modeSelect").value;

    document.getElementById("questionCounter").textContent =
      `문제 ${currentIndex + 1} / ${quizPool.length}`;
    document.getElementById("bookIndicator").textContent =
      isWrongQuizMode ? "📌 오답 집중 복습 모드" : VOCAB_DB[currentBook].title;
    document.getElementById("unitTag").textContent = q.unit || "핵심 어휘";

    const progressPct = ((currentIndex + 1) / quizPool.length) * 100;
    document.getElementById("progressFill").style.width = `${progressPct}%`;

    const qMain = document.getElementById("questionMain");
    const pronBox = document.getElementById("pronunciationText");

    if (mode === "mc_ar2ko" || mode === "sub_ar2ko") {
      qMain.className = "arabic-word";
      qMain.textContent = formatArabic(q.ar);
      pronBox.textContent = `[${q.pron}]`;
      pronBox.classList.toggle("hidden", !showPron);
    } else {
      qMain.className = "korean-question";
      qMain.textContent = q.ko;
      pronBox.textContent = showPron ? `힌트 발음: ${q.pron}` : "";
      pronBox.classList.toggle("hidden", !showPron);
    }

    const mcArea = document.getElementById("mcArea");
    const subArea = document.getElementById("subArea");

    if (mode.startsWith("mc_")) {
      mcArea.style.display = "grid";
      subArea.style.display = "none";
      renderMultipleChoice(q, mode);
    } else {
      mcArea.style.display = "none";
      subArea.style.display = "flex";
      const input = document.getElementById("subInput");
      input.value = "";
      input.disabled = false;
      if (mode === "sub_ko2ar") {
        input.className = "sub-input ar-input";
        input.placeholder = "아랍어로 입력하세요 (모음부호 생략 가능)";
      } else {
        input.className = "sub-input";
        input.placeholder = "한글 뜻을 입력하세요 (예: 감사합니다)";
      }
      setTimeout(() => input.focus(), 50);
    }
  }

  function renderMultipleChoice(correctWord, mode) {
    const mcArea = document.getElementById("mcArea");
    mcArea.innerHTML = "";

    // 전체 책 풀에서 오답 보기 3개 추출
    let allBookWords = [];
    Object.values(VOCAB_DB[currentBook].units).forEach(arr => allBookWords.push(...arr));
    const distractors = shuffleArray(
      allBookWords.filter(w => w.ar !== correctWord.ar)
    ).slice(0, 3);

    const choices = shuffleArray([correctWord, ...distractors]);

    choices.forEach(item => {
      const btn = document.createElement("button");
      btn.className = "option-btn";

      if (mode === "mc_ar2ko") {
        btn.textContent = item.ko;
      } else {
        btn.innerHTML = `
          <span class="ar-opt">${formatArabic(item.ar)}</span>
          ${showPron ? `<span class="sub-pron">${item.pron.split(" ")[0]}</span>` : ""}
        `;
      }

      btn.onclick = () => handleChoice(btn, item.ar === correctWord.ar, correctWord);
      mcArea.appendChild(btn);
    });
  }

  function handleChoice(clickedBtn, isCorrect, correctWord) {
    if (answered) return;
    answered = true;
    stats.total++;

    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(b => (b.disabled = true));

    if (isCorrect) {
      stats.correct++;
      clickedBtn.classList.add("correct");
      showFeedback(true, correctWord);
    } else {
      clickedBtn.classList.add("wrong");
      // 정답 버튼 하이라이트
      const mode = document.getElementById("modeSelect").value;
      buttons.forEach(b => {
        if (mode === "mc_ar2ko" && b.textContent === correctWord.ko) {
          b.classList.add("correct");
        } else if (mode === "mc_ko2ar" && b.textContent.includes(formatArabic(correctWord.ar))) {
          b.classList.add("correct");
        }
      });
      addWrongNote(correctWord);
      showFeedback(false, correctWord);
    }
    updateScoreBadge();
  }

  function checkSubjective() {
    if (answered) {
      nextQuestion();
      return;
    }
    const input = document.getElementById("subInput");
    const userVal = input.value.trim();
    if (!userVal) return;

    answered = true;
    stats.total++;
    input.disabled = true;

    const q = quizPool[currentIndex];
    const mode = document.getElementById("modeSelect").value;
    let isCorrect = false;

    if (mode === "sub_ar2ko") {
      const normUser = userVal.replace(/\s+/g, "");
      const candidates = [q.ko, ...(q.alts || [])].map(s => s.replace(/\s+/g, ""));
      // 슬래시(/)로 구분된 뜻 중 하나만 맞춰도 정답 인정
      const splitCandidates = q.ko.split("/").map(s => s.trim().replace(/\s+/g, ""));
      isCorrect = [...candidates, ...splitCandidates].some(
        ans => ans === normUser || (normUser.length >= 2 && ans.includes(normUser))
      );
    } else {
      // 아랍어 입력 시 모음부호(하르카트) 제거 후 비교
      const cleanUser = stripHarakat(userVal).replace(/\s+/g, "");
      const cleanAns = stripHarakat(q.ar).replace(/\s+/g, "");
      isCorrect = cleanUser === cleanAns;
    }

    if (isCorrect) {
      stats.correct++;
      showFeedback(true, q);
    } else {
      addWrongNote(q);
      showFeedback(false, q);
    }
    updateScoreBadge();
  }

  function showFeedback(isCorrect, word) {
    const box = document.getElementById("feedbackBox");
    box.className = `feedback-box show ${isCorrect ? "ok" : "no"}`;
    box.innerHTML = `
      <strong>${isCorrect ? "⭕ 정답입니다!" : "❌ 오답입니다! (오답 노트에 자동 저장됨)"}</strong><br/>
      <span style="font-family:'Noto Sans Arabic', sans-serif; font-size:1.3rem; font-weight:700;">${word.ar}</span>
      &nbsp;[${word.pron}] — <strong>${word.ko}</strong>
    `;
  }

  function nextQuestion() {
    if (quizPool.length === 0) return;
    currentIndex = (currentIndex + 1) % quizPool.length;
    renderQuestion();
  }

  function updateScoreBadge() {
    const pct = stats.total === 0 ? 0 : Math.round((stats.correct / stats.total) * 100);
    document.getElementById("scoreBadge").textContent =
      `정답률 ${pct}% (${stats.correct}/${stats.total})`;
  }

  // 토글 기능들
  function togglePronunciation() {
    showPron = !showPron;
    const btn = document.getElementById("togglePronBtn");
    btn.classList.toggle("on", showPron);
    btn.textContent = `🔤 발음(음역) 표시: ${showPron ? "ON" : "OFF"}`;
    renderQuestion();
  }

  function toggleHarakat() {
    showHarakat = !showHarakat;
    const btn = document.getElementById("toggleHarakatBtn");
    btn.classList.toggle("on", showHarakat);
    btn.textContent = `✨ 모음부호(하르카트): ${showHarakat ? "ON" : "OFF"}`;
    renderQuestion();
  }

  // 아랍어 음성 합성(TTS) 발음 듣기
  function speakCurrentWord() {
    if (quizPool.length === 0) return;
    const word = quizPool[currentIndex];
    if (!("speechSynthesis" in window)) {
      alert("현재 브라우저에서는 음성 듣기(TTS)를 지원하지 않습니다.");
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(word.ar);
    utter.lang = "ar-SA";
    utter.rate = 0.85;
    window.speechSynthesis.speak(utter);
  }

  // 오답 노트 관리
  function addWrongNote(word) {
    if (!wrongNotes.some(w => w.ar === word.ar)) {
      wrongNotes.push(word);
      saveWrongNotes();
    }
  }

  function removeWrongNote(arText) {
    wrongNotes = wrongNotes.filter(w => w.ar !== arText);
    saveWrongNotes();
    renderWrongList();
  }

  function clearWrongNotes() {
    if (!confirm("저장된 오답 노트를 모두 비우시겠습니까?")) return;
    wrongNotes = [];
    saveWrongNotes();
    renderWrongList();
  }

  function saveWrongNotes() {
    localStorage.setItem("arabic_wrong_notes_v1", JSON.stringify(wrongNotes));
    updateWrongCount();
  }

  function updateWrongCount() {
    document.getElementById("wrongCount").textContent = wrongNotes.length;
  }

  function toggleWrongMode(forceState) {
    isWrongNoteView = typeof forceState === "boolean" ? forceState : !isWrongNoteView;
    document.getElementById("wrongModeBtn").classList.toggle("on", isWrongNoteView);
    document.getElementById("quizArea").style.display = isWrongNoteView ? "none" : "block";
    document.getElementById("wrongNoteArea").classList.toggle("active", isWrongNoteView);

    if (isWrongNoteView) {
      renderWrongList();
    }
  }

  function renderWrongList() {
    const container = document.getElementById("wrongListContainer");
    if (wrongNotes.length === 0) {
      container.innerHTML = `<div class="empty-state">아직 틀린 단어가 없습니다. 퀴즈를 풀면서 틀린 단어가 이곳에 자동으로 모입니다!</div>`;
      return;
    }

    container.innerHTML = wrongNotes
      .map(
        w => `
      <div class="wrong-item">
        <div class="ar">${w.ar}</div>
        <div class="info">
          <div style="font-weight:700;">${w.ko}</div>
          <div style="font-size:0.82rem; color:var(--text-muted);">${w.pron} · ${w.unit || ""}</div>
        </div>
        <button class="secondary-btn" style="padding:6px 10px; font-size:0.8rem;" onclick="removeWrongNote('${w.ar}')">암기 완료(삭제)</button>
      </div>
    `
      )
      .join("");
  }

  function startWrongQuiz() {
    if (wrongNotes.length === 0) {
      alert("오답 노트에 저장된 단어가 없습니다.");
      return;
    }
    isWrongQuizMode = true;
    toggleWrongMode(false);
    quizPool = shuffleArray(wrongNotes);
    currentIndex = 0;
    renderQuestion();
  }

  // 앱 시작
  init();
</script>
</body>
</html>
